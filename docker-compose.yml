name: tube-site-staging

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
  WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
  WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
  WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
  # WP-Cron is never used in this project (ARCHITECTURE.md §7) — every
  # background task runs via Linux cron + WP-CLI (see the `cron` service
  # below) instead of the HTTP pseudo-cron trigger. Shared across every
  # service that loads wp-config.php, so `wp-cli`/`cron` see the same
  # config the live site does (previously only `wordpress` had this,
  # which caused wp-cli to report DISABLE_WP_CRON as unset even though
  # the live site had it correctly enabled).
  #
  # TUBE_CACHE_REDIS_HOST/PORT (ARCHITECTURE.md §12 Phase 3) and
  # TUBE_CORE_REDIS_HOST/PORT (Phase 4): the WORDPRESS_DB_* vars above are
  # natively read by the wordpress:* images themselves; Redis has no such
  # native support, so each plugin that needs it reads its own pair of
  # constants instead, both baked in from the same REDIS_HOST/REDIS_PORT
  # .env values (one physical Redis instance) — kept as separate,
  # distinctly-named constants per plugin rather than shared, since
  # tube-core cannot depend on tube-cache for this
  # (ARCHITECTURE_FREEZE.md's frozen decision #1: tube-core has no plugin
  # dependency) and each plugin's config should stay self-contained.
  #
  # TUBE_CORE_CLOUDFLARE_STREAM_WEBHOOK_SECRET (Phase 5): the shared
  # secret Tube_Core\Stream\WebhookController verifies incoming Cloudflare
  # Stream webhook signatures against. Fails closed if unset (every
  # request rejected) — see WebhookController::check_signature().
  #
  # TUBE_PLAYER_* (Phase 6): Tube_Player\Plugin reads these to build
  # Cloudflare Stream/Images URLs at render time — never a stored
  # playback URL (ARCHITECTURE.md §2.1). Signed URLs are opt-in: leaving
  # SIGNING_KEY_ID/PEM_BASE64 empty means unsigned mode, the default this
  # phase's instructions require. SIGNING_KEY_PEM is base64-encoded
  # because a multi-line PEM cannot round-trip through a single-line
  # define() the way every other constant here does — decoded in
  # Tube_Player\Plugin::decoded_signing_key_pem(), never logged.
  WORDPRESS_CONFIG_EXTRA: |
    define( 'DISABLE_WP_CRON', true );
    define( 'TUBE_CACHE_REDIS_HOST', '${REDIS_HOST:-redis}' );
    define( 'TUBE_CACHE_REDIS_PORT', ${REDIS_PORT:-6379} );
    define( 'TUBE_CORE_REDIS_HOST', '${REDIS_HOST:-redis}' );
    define( 'TUBE_CORE_REDIS_PORT', ${REDIS_PORT:-6379} );
    define( 'TUBE_CORE_CLOUDFLARE_STREAM_WEBHOOK_SECRET', '${CLOUDFLARE_STREAM_WEBHOOK_SECRET:-}' );
    define( 'TUBE_PLAYER_CLOUDFLARE_STREAM_CUSTOMER_CODE', '${CLOUDFLARE_STREAM_CUSTOMER_CODE:-}' );
    define( 'TUBE_PLAYER_CLOUDFLARE_STREAM_SIGNING_KEY_ID', '${CLOUDFLARE_STREAM_SIGNING_KEY_ID:-}' );
    define( 'TUBE_PLAYER_CLOUDFLARE_STREAM_SIGNING_KEY_PEM_BASE64', '${CLOUDFLARE_STREAM_SIGNING_KEY_PEM_BASE64:-}' );
    define( 'TUBE_PLAYER_SIGNED_URL_TTL_SECONDS', ${CLOUDFLARE_STREAM_SIGNED_URL_TTL_SECONDS:-3600} );
    define( 'TUBE_PLAYER_CLOUDFLARE_IMAGES_ACCOUNT_HASH', '${CLOUDFLARE_IMAGES_ACCOUNT_HASH:-}' );

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.3-fpm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *wordpress-env
      WORDPRESS_DEBUG: 1
    volumes:
      - wp-core-data:/var/www/html
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/themes:/var/www/html/wp-content/themes

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - wp-core-data:/var/www/html:ro
      - ./wp-content/plugins:/var/www/html/wp-content/plugins:ro
      - ./wp-content/themes:/var/www/html/wp-content/themes:ro
      - ./ops/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  wpcli:
    image: wordpress:cli-php8.3
    # Alpine's www-data (uid 82, this image) differs from Debian's www-data
    # (uid 33, the wordpress:php8.3-fpm image) — a Docker-only cross-image
    # UID mismatch, not a real production concern. Running as root here
    # avoids spurious "wp-config.php is not writable" errors when wp-cli
    # needs to touch files the wordpress/nginx containers created.
    user: root
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wordpress-env
    volumes:
      - wp-core-data:/var/www/html
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./ops/benchmark:/var/www/html/ops/benchmark:ro
    entrypoint: ["tail", "-f", "/dev/null"]

  # Linux cron + WP-CLI sidecar. Never WP-Cron — see ARCHITECTURE.md §7 and
  # ops/cron/staging.cron for the full job list (currently no-op placeholders,
  # Phase 0 only).
  cron:
    build:
      context: .
      dockerfile: ops/docker/cron/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wordpress-env
    volumes:
      - wp-core-data:/var/www/html
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./ops/cron/logs:/var/log/tube-cron

volumes:
  db-data:
  wp-core-data:
