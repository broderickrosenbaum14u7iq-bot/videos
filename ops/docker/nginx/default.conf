server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    client_max_body_size 64m;

    # Deny sensitive internals before the generic PHP handler below ever
    # sees them -- nginx checks regex `location` blocks in the order
    # they appear in this file and stops at the first match, so these
    # must come before `~ \.php$` or a request like
    # /wp-content/plugins/tube-core/vendor/autoload.php would still hit
    # PHP-FPM and execute (confirmed live during the 2026-08-28 P0
    # audit: that exact request returned 200 with `X-Powered-By: PHP`,
    # proving it ran rather than just being served as text).
    #
    # Composer/test internals -- never web-accessible, executable or
    # not: dependency-version reconnaissance (composer.lock) and, far
    # more seriously, arbitrary PHP execution under vendor/tests if any
    # package or test bootstrap there ever does more than register an
    # autoloader.
    location ~ /(vendor|tests)/ {
        deny all;
        return 404;
    }

    location ~ /composer\.(json|lock)$ {
        deny all;
        return 404;
    }

    # Version control and environment files -- .git would leak the
    # entire repository history (including anything ever committed by
    # mistake); .env holds real runtime secrets (DB credentials, OAuth
    # client secret, Cloudflare tokens) and must never be servable even
    # though it's already git-ignored.
    location ~ /\.git {
        deny all;
        return 404;
    }

    location ~ /\.env {
        deny all;
        return 404;
    }

    # Any other dotfile (.gitignore, .editorconfig, a stray .DS_Store,
    # etc.) -- none of this project's dotfiles are meant to be served,
    # and this is a closed allow-by-default posture for anything that
    # slips in later without needing its own rule. `.well-known` is the
    # one standard exception (ACME/TLS challenge files, security.txt).
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
