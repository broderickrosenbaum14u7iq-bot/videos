; Raises the stock wordpress:php8.3-fpm image's default upload limits
; (upload_max_filesize=2M, post_max_size=8M, memory_limit=128M) to values
; that can actually hold a real photo from a phone/camera and process its
; thumbnail derivatives. Bind-mounted read-only into
; /usr/local/etc/php/conf.d/ (the standard docker-library/php
; drop-in-config directory) by the wordpress and wpcli services.
;
; The stock defaults were found, during a real browser-upload test, to
; fail confusingly: post_max_size being exceeded makes PHP silently empty
; $_POST/$_FILES entirely (no distinguishable upload-too-large error),
; which surfaces to WordPress as a generic "The link you followed has
; expired" nonce failure rather than a clear file-size message.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
